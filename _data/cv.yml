- title: Research & Professional Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: FAIR, Meta Superintelligence Labs, London, UK
      year: Jul 2025 – Present
      description:
        - "<b>AIRA<sub>3</sub> (Kaggle Gold Medal):</b> Co-first author of an autonomous research agent that fine-tuned a 30B reasoning model end-to-end with no human in the loop, placing 8th of ~4,000 teams in NVIDIA's live Nemotron challenge — the first Kaggle gold medal won by an autonomous system. <a href=\"https://x.com/AIatMeta/status/2096271545589190927\">[announcement]</a>"
        - "<b>AIRA<sub>2</sub> (NeurIPS 2026):</b> Co-first author; identified the bottlenecks limiting AI research agents on MLE-bench and removed them by scaling agents across many GPUs. <a href=\"https://arxiv.org/abs/2603.26499\">[pdf]</a>"
        - "<b>AgentBox (FAIR Engineering Award):</b> Built the execution infrastructure for running autonomous agents at scale across MSL, the backbone of multi-GPU AIRA experiments."
        - "<b>Production Impact:</b> Applied research agents to production GPU and accelerator kernel generation: 1.25–17× speedups on recommendation and LLM models, 27% lower kernel latency (internal benchmark), weeks-to-hours development."
        - "<b>Data Annotation & AI Co-Scientists (ICML 2026):</b> Led large-scale collection of research ideas from AIRA<sub>1</sub> and their annotation as preference data to train rubric-based LLM judges, used to improve AIRA<sub>2</sub> via quality-diversity search. These annotations underpinned training AI co-scientists with RL on rubric rewards, whose research plans experts preferred for 70% of goals. <a href=\"https://openreview.net/pdf?id=bTySLCPXHO\">[pdf]</a>"

    - title: Research Scientist Intern
      institution: FAIR (Meta AI), London, UK
      year: Aug 2024 – Feb 2025
      description:
        - "<b>AIRA<sub>1</sub> (NeurIPS 2025 Spotlight):</b> Developed research agents for MLE-bench, studying search policies, exploration, and generalization; open-sourced <b>aira-dojo</b>. <a href=\"https://arxiv.org/abs/2507.02554\">[pdf]</a> <a href=\"https://github.com/facebookresearch/aira-dojo\">[code]</a>"
        - "<b>SAM 3 (ICLR 2026):</b> Contributed to compositional-concept evaluation for Segment Anything with Concepts. <a href=\"https://arxiv.org/pdf/2511.16719v1\">[pdf]</a> <a href=\"https://github.com/facebookresearch/sam3\">[code]</a>"

    - title: Research Scientist Intern
      institution: Meta Reality Labs Research, Redmond, USA
      year: Jul 2022 – Dec 2022
      description:
        - "<b>EgoTV (ICCV 2023):</b> First author; built a benchmark for verifying compositional multi-step tasks from natural-language descriptions in egocentric video, and proposed a neuro-symbolic grounding model for it. <a href=\"https://rishihazra.github.io/EgoTV/\">[web]</a> <a href=\"https://arxiv.org/pdf/2303.16975.pdf\">[pdf]</a> <a href=\"https://github.com/facebookresearch/EgoTV\">[code]</a>"

    - title: Data Scientist
      institution: Amazon Alexa-AI, Bangalore, India
      year: Apr 2020 – Sep 2020
      description:
        - "<b>Alexa Metrics:</b> Built evaluations bridging offline and online Natural Language Understanding metrics."

    - title: Research Associate
      institution: Statistics & Machine Learning Group, IISc Bangalore
      year: Jun 2019 – Mar 2020
      description:
        - "<b>Networked MARL (AAMAS 2020):</b> Co-first author; multi-agent RL with emergent communication. <a href=\"https://arxiv.org/pdf/2004.02780.pdf\">[pdf]</a>"


